[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-maintenance-agent"
version = "0.2.0"
description = "Agent workflow for scoped repository maintenance, validation, and reviewer-ready summaries."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Anthropic Claude Opus", email = "opensource@anthropic.com" }
]
keywords = [
  "agent",
  "repository",
  "maintenance",
  "automation",
  "developer-tools",
  "repo-ops"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Version Control",
  "Topic :: Software Development :: Quality Assurance"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Andrew0x7/autonomous-maintenance-agent"
Repository = "https://github.com/Andrew0x7/autonomous-maintenance-agent"
Issues = "https://github.com/Andrew0x7/autonomous-maintenance-agent/issues"

[project.scripts]
repo-maintainer = "auditor.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["auditor*"]
